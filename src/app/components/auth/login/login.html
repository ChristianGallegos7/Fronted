<div class="p-10 flex justify-center h-screen items-center fondo-barco">
  <div class="overlay"></div>
  <div class="rounded-lg p-10 shadow-2xl relative z-10">
    <form
      nz-form
      [formGroup]="validateForm"
      class="w-[400px]"
      (ngSubmit)="submitForm()"
    >
      <div class="mb-8 text-center">
        <h1 class="text-3xl text-white!">Bienvenido</h1>
        <p class="text-gray-300 text-sm mt-1">Ingresa tus datos para acceder</p>
      </div>

      <nz-form-item>
        <nz-form-control nzErrorTip="Usuario es requerido!">
          <nz-input-wrapper>
            <nz-icon nzInputPrefix nzType="user" />
            <input
              type="text"
              nz-input
              formControlName="username"
              placeholder="Username"
              class="custom-input"
            />
          </nz-input-wrapper>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-control nzErrorTip="Contraseña es requerida!">
          <nz-input-password>
            <nz-icon nzInputPrefix nzType="lock" />
            <input
              nz-input
              formControlName="password"
              placeholder="Password"
              class="custom-input"
            />
          </nz-input-password>
        </nz-form-control>
      </nz-form-item>

      <div class="flex justify-end mb-6">
        <a class="text-xs font-medium text-blue-500 hover:text-blue-600 transition-colors"
          >¿Olvidaste tu contraseña?</a
        >
      </div>

      <button nz-button nzBlock [nzType]="'primary'" class="login-button h-11">Iniciar Sesión</button>
    </form>
  </div>
</div>
